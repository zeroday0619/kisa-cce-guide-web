name: Deploy GitHub Pages site

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          python-version: "3.13"

      - name: Install development dependencies
        run: uv sync --dev --locked

      - name: Validate canonical content
        run: uv run --locked python -m conversion.validate_content

      - name: Build GitHub Pages artifact
        run: >-
          uv run --locked python -m conversion.build_content
          --base-path "${{ steps.pages.outputs.base_path }}"

      - name: Verify original and revised editions
        run: |
          test -f .artifacts/build/site/unix/u-01/index.html
          test -f .artifacts/build/site/revised/index.html
          test -f .artifacts/build/site/revised/unix/u-01/index.html
          test -f .artifacts/build/site/revised/unix/u-67/index.html
          test -f .artifacts/build/site/revised/dataset.json

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: .artifacts/build/site
          include-hidden-files: true

  deploy:
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
